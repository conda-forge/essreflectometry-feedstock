context:
  name: essreflectometry
  version: "26.6.0"
  python_min: "3.11"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/essreflectometry-${{ version }}.tar.gz
  sha256: be4f8b392e5ab8f1ed683a355a92f8b69a5b6e5c9e746b3d64f8b9db458f5b78

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=77
    - setuptools-scm >=8.0
    - pip
  run:
    - python >=${{ python_min }}
    - dask-core >=2022.1.0
    - python-dateutil >=2.8.2
    - python-graphviz
    - plopp >=24.7.0
    - orsopy >=1.2
    - sciline >=24.6.0
    - scipp >=24.09.1
    - scippneutron >=24.10.0
    - scippnexus >=24.9.1
    - essreduce >=26.6.0
    - esspolarization >=25.7.0
    - pandas >=2.1.2

tests:
  - python:
      imports:
        - ess.reflectometry
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: Reflectometry data reduction for the European Spallation Source
  license: BSD-3-Clause
  license_file: LICENSE
  repository: https://github.com/scipp/ess/tree/main/packages/essreflectometry
  homepage: https://scipp.github.io/ess/reflectometry/

extra:
  recipe-maintainers:
    - MridulS
    - conda-forge/scipp
